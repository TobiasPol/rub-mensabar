name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build number and version are derived from git history

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check shell scripts
        run: |
          for script in script/*.sh; do bash -n "$script"; done
          if command -v shellcheck >/dev/null; then shellcheck script/*.sh; fi

      - name: Test
        run: swift test --disable-sandbox

      - name: Package (ad-hoc signed)
        env:
          CODESIGN_IDENTITY: "-"
        run: ./script/package_release.sh "0.0.0-ci.${{ github.run_number }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RUBMensaBar-ci-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error
