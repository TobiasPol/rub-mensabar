name: Release

# Push a tag like v0.2.0 or v0.2.0-beta.1 to build, sign, notarize and publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version tag (v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point at a commit on main"
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          [[ "$VERSION" == *-* ]] && PRERELEASE=true || PRERELEASE=false
          echo "prerelease=$PRERELEASE" >>"$GITHUB_OUTPUT"

      - name: Extract release notes
        run: ./script/release_notes.sh "${{ steps.version.outputs.version }}" >"$RUNNER_TEMP/release-notes.md"

      - name: Test
        run: swift test --disable-sandbox

      - name: Import signing certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: ./script/ci_import_certificate.sh

      - name: Prepare notary API key
        env:
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode >"$KEY_PATH"
          echo "NOTARY_API_KEY_PATH=$KEY_PATH" >>"$GITHUB_ENV"

      - name: Build, sign and notarize
        id: package
        env:
          REQUIRE_NOTARIZATION: "1"
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: ./script/package_release.sh "${{ steps.version.outputs.version }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --verify-tag \
            --title "RUB MensaBar $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease="${{ steps.version.outputs.prerelease }}"

      - name: Clean up signing material
        if: always()
        run: |
          [[ -n "${CODESIGN_KEYCHAIN:-}" ]] && security delete-keychain "$CODESIGN_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-api-key.p8"

  update-cask:
    name: Open Homebrew cask PR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update cask and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          ./script/update_cask.sh "$VERSION" "$SHA256"
          if git diff --quiet; then
            echo "Cask already points at v$VERSION"
            exit 0
          fi
          BRANCH="release/cask-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "chore(cask): update rub-mensabar to v$VERSION"
          # On a re-run the branch may already exist. checkout only maps main
          # to a tracking ref, so pass the lease's expected tip explicitly
          # (empty = branch must not exist yet).
          REMOTE_TIP="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)"
          git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_TIP" origin "$BRANCH"
          if [[ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            echo "Cask PR for v$VERSION is already open"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore(cask): update rub-mensabar to v$VERSION" \
            --body "Points the Homebrew cask at the notarized \`v$VERSION\` release (sha256 \`$SHA256\`)."
